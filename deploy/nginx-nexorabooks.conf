# Nexora Books — nginx site
#
# Copy to /etc/nginx/sites-available/nexorabooks and symlink it into
# sites-enabled. Replace books.example.com with your own subdomain in all
# three places, then run certbot (see deploy/README.txt) which fills in the
# certificate lines by itself.
#
# ---------------------------------------------------------------------------
# ONE LINE GOES SOMEWHERE ELSE. This has to sit inside the http { } block of
# /etc/nginx/nginx.conf, not in this file — nginx will not start otherwise:
#
#     limit_req_zone $binary_remote_addr zone=nexora_login:10m rate=12r/m;
#
# It is what stops somebody working through a password list at their leisure.
# The application throttles guesses too, but a limit the attacker never even
# reaches the application to trigger is worth more.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name books.example.com;

    # Everything goes to HTTPS. On a private office network plain HTTP was a
    # reasonable risk; on the open internet it means every password and every
    # figure travels in clear text past everybody in between.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name books.example.com;

    # certbot writes these two lines. Do not fill them in by hand.
    # ssl_certificate     /etc/letsencrypt/live/books.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/books.example.com/privkey.pem;

    # Attachments are capped at 10 MB inside the software. Allowing a little
    # over that means an oversized upload is refused by Nexora Books with an
    # explanation, rather than by nginx with a bare 413.
    client_max_body_size 12M;

    # A slow connection in a Nigerian branch office should not lose a long
    # report halfway through rendering.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/nexorabooks-access.log;
    error_log  /var/log/nginx/nexorabooks-error.log;

    # Signing in is the one place worth rate limiting. Twelve attempts a
    # minute is generous for a person and hopeless for a script.
    location = /login {
        limit_req zone=nexora_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8756;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8756;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
